name: Cleanup superseded releases

# One-off: the Sirus line is published as a single consolidated v2.1.10, so
# its intermediate releases are removed. Runs once on push, then the file is
# deleted in a follow-up commit.

on:
  push:
    paths:
      - .github/workflows/cleanup-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete superseded releases
        run: |
          set -euo pipefail
          for TAG in v2.1.11 v2.1.12; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Deleting release $TAG"
              gh release delete "$TAG" --cleanup-tag --yes
            else
              echo "No release $TAG"
            fi
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "Deleting leftover tag $TAG"
              git push origin ":refs/tags/$TAG"
            fi
          done

      - name: Show remaining releases
        run: gh release list --limit 20
